name: Update README
on:
  schedule: [{ cron: "17 */6 * * *" }]   # every 6 hours
  workflow_dispatch:                     # manual run button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo list ztancrell --visibility public --limit 300 \
            --json name,url,description,primaryLanguage,pushedAt > "$RUNNER_TEMP/repos.json"
          python3 .github/scripts/update_readme.py "$RUNNER_TEMP/repos.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "Update README"; git push; }
